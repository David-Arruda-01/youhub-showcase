version: '3.8'

services:
  youhub-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youhub-showcase
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - youhub-network

networks:
  youhub-network:
    driver: bridge
